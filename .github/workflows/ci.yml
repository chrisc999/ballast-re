name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy-pages job below widens this for itself only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Gate every PR: format, lint, test, wasm build -----------------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup reads rust-toolchain.toml and installs the pinned toolchain +
      # the wasm32v1-none target automatically.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      # The OZ stellar-tokens base enables soroban-sdk's experimental_spec_shaking_v2,
      # which MUST be built via `stellar contract build` (not plain `cargo build`).
      # Install the prebuilt CLI binary to avoid a slow `cargo install`.
      - name: Install stellar-cli (prebuilt)
        run: |
          curl -sSL -o stellar-cli.tgz https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "9915fe63753d7154c26bb9e6410cf1d1ff9727a9b378e663c2790ab7a266af94  stellar-cli.tgz" | sha256sum -c -
          tar xzf stellar-cli.tgz
          sudo install -m 755 stellar /usr/local/bin/stellar
          stellar --version

      - name: Wasm build
        run: stellar contract build

  # ---- Web console: typecheck, lint, production build ----------------------
  # Built once here, then published as the root of the Pages site
  # (app.ballastre.xyz), with the coverage report under /coverage/. Gates PRs
  # too: a console that no longer builds is a failure.
  web-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload console build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-console
          path: app/dist

  # ---- Coverage report (published publicly by deploy-pages) ----------------
  coverage:
    needs: web-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Prebuilt binary — avoids a slow `cargo install`.
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov

      - name: Coverage (HTML + lcov + summary)
        run: |
          cargo llvm-cov --all --html --output-dir coverage-html
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Job summary
        run: |
          echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html

      # Package the site for GitHub Pages (consumed by deploy-pages): the web
      # console at the root, the coverage report (which cargo llvm-cov nests under
      # html/) at /coverage/, and a redirect so the console's old /app/ address
      # still lands on it.
      - name: Add web console to the site
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-console
          path: site

      - name: Assemble site
        if: github.ref == 'refs/heads/main'
        run: |
          cp -R coverage-html/html site/coverage
          mkdir -p site/app
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="../"><title>baUSD</title><a href="../">baUSD console</a>' > site/app/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # ---- Publish the coverage report + web console to GitHub Pages (main only) --
  # Publishes publicly when the repo/Pages is public.
  deploy-pages:
    # Publishing requires the whole suite, not just the coverage job.
    needs: [build-test, coverage]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
