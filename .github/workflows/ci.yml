name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy-pages job below widens this for itself only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Gate every PR: format, lint, test, wasm build -----------------------
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml and installs the pinned toolchain +
      # the wasm32v1-none target automatically.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      # The OZ stellar-tokens base enables soroban-sdk's experimental_spec_shaking_v2,
      # which MUST be built via `stellar contract build` (not plain `cargo build`).
      # Install the prebuilt CLI binary to avoid a slow `cargo install`.
      - name: Install stellar-cli (prebuilt)
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo install -m 755 stellar /usr/local/bin/stellar
          stellar --version

      - name: Wasm build
        run: stellar contract build

  # ---- Coverage report (published publicly by deploy-pages) ----------------
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Prebuilt binary — avoids a slow `cargo install`.
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage (HTML + lcov + summary)
        run: |
          cargo llvm-cov --all --html --output-dir coverage-html
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Job summary
        run: |
          echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html

      # Package the HTML for GitHub Pages (consumed by deploy-pages).
      # cargo llvm-cov nests the report under html/, so publish that subdir as the
      # Pages root — the report then serves at the site root, not /html/.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage-html/html

  # ---- Publish the coverage report to GitHub Pages (main only) -------------
  # Publishes the coverage report publicly when the repo/Pages is public.
  deploy-pages:
    needs: coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
